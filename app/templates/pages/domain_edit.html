{% extends "base.html" %}
{% block title %}Edit {{ domain.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-7">

    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="/domains/{{ domain.id }}" class="btn btn-sm btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-1"></i>Back
      </a>
      <div>
        <h1 class="h3 mb-0 fw-bold">Edit Domain</h1>
        <p class="text-muted small mb-0 domani-domain-title">{{ domain.name }}</p>
      </div>
    </div>

    <div class="card domani-card">
      <div class="card-body p-4">
        <form method="post" action="/domains/{{ domain.id }}/edit">

          <div class="mb-4">
            <label class="form-label fw-semibold">
              <i class="fa-solid fa-eye me-1 text-primary"></i>Watch Type
            </label>
            <div class="row g-3">
              <div class="col-6">
                <input type="radio" class="btn-check" name="watch_type" id="watchSnag" value="snag"
                       {% if domain.watch_type == 'snag' %}checked{% endif %} />
                <label class="btn domani-radio-card w-100" for="watchSnag">
                  <div class="d-flex flex-column align-items-center py-2">
                    <i class="fa-solid fa-crosshairs fa-2x mb-2 text-primary"></i>
                    <strong>Snag It</strong>
                  </div>
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" name="watch_type" id="watchOwn" value="own"
                       {% if domain.watch_type == 'own' %}checked{% endif %} />
                <label class="btn domani-radio-card w-100" for="watchOwn">
                  <div class="d-flex flex-column align-items-center py-2">
                    <i class="fa-solid fa-shield fa-2x mb-2 text-success"></i>
                    <strong>Protect It</strong>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label for="check_interval_hours" class="form-label fw-semibold">
              <i class="fa-solid fa-rotate me-1 text-primary"></i>Check Interval
            </label>
            <select class="form-select domani-select" id="check_interval_hours" name="check_interval_hours">
              <option value="1" {% if domain.check_interval_hours == 1 %}selected{% endif %}>Every hour</option>
              <option value="3" {% if domain.check_interval_hours == 3 %}selected{% endif %}>Every 3 hours</option>
              <option value="6" {% if domain.check_interval_hours == 6 %}selected{% endif %}>Every 6 hours</option>
              <option value="12" {% if domain.check_interval_hours == 12 %}selected{% endif %}>Every 12 hours</option>
              <option value="24" {% if domain.check_interval_hours == 24 %}selected{% endif %}>Daily</option>
              <option value="48" {% if domain.check_interval_hours == 48 %}selected{% endif %}>Every 2 days</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="tags" class="form-label fw-semibold">
              <i class="fa-solid fa-tags me-1 text-primary"></i>Tags
            </label>
            <input type="text" class="form-control domani-input" id="tags" name="tags"
                   value="{{ domain.tags or '' }}" placeholder="tag1, tag2" />
          </div>

          <div class="mb-4">
            <label for="notes" class="form-label fw-semibold">
              <i class="fa-solid fa-note-sticky me-1 text-primary"></i>Notes
            </label>
            <textarea class="form-control domani-input" id="notes" name="notes" rows="3">{{ domain.notes or '' }}</textarea>
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a href="/domains/{{ domain.id }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
