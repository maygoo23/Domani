{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="domani-error-icon text-danger mb-4">
    <i class="fa-solid fa-circle-exclamation"></i>
  </div>
  <h1 class="h2 fw-bold mb-2">500 — Server Error</h1>
  <p class="text-muted mb-4">{{ message or "Something went wrong on our end." }}</p>
  <a href="/" class="btn btn-primary">
    <i class="fa-solid fa-house me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
