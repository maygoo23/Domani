{% extends "base.html" %}
{% block title %}Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="domani-error-icon mb-4">
    <i class="fa-solid fa-circle-question"></i>
  </div>
  <h1 class="h2 fw-bold mb-2">404 — Not Found</h1>
  <p class="text-muted mb-4">{{ message or "The page you're looking for doesn't exist." }}</p>
  <a href="/" class="btn btn-primary">
    <i class="fa-solid fa-house me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
